services:
  flickarr:
    image: ghcr.io/shadowwhisperer/flickarr:latest
    container_name: flickarr
    ports:
      - 5000:5000
    volumes:
      - ./data:/app/data
    environment:
      - TMDB_API_KEY=your_key # Replace with your TMDB API key
      - DEFAULT_LANGUAGES=en  # en,es,fr,de,ja,ko,zh,pt,ru,hi,ar,it
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: 1000:1000           # User ID: id -u <USER_NAME>
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import requests; requests.get('http://localhost:5000/', timeout=5)
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 10s
