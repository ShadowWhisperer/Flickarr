services:
  flickarr:
    image: ghcr.io/shadowwhisperer/flickarr:latest
    container_name: flickarr
    ports:
      - 5000:5000
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 200m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: 1000:1000           # User ID: id -u <USER_NAME>
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import requests; requests.get('http://localhost:5000/', timeout=5)
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 10s
